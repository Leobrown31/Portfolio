<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
       <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <style>
       /* FUTURISTIC NEON BACKGROUND */
body {
    margin: 0;
    min-height: 100vh;
    background-color: #020617;
    color: #ffffff;
    font-family: Arial, sans-serif;
    overflow-x: hidden;

    background-image:
        radial-gradient(circle at 20% 30%,
            rgba(0, 140, 255, 0.3),
            transparent 40%),
        radial-gradient(circle at 80% 70%,
            rgba(140, 0, 255, 0.25),
            transparent 40%);

    background-attachment: fixed;
}

/* NEON GRID EFFECT */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
        linear-gradient(rgba(0, 195, 255, 0.12) 1px,
            transparent 1px),
        linear-gradient(90deg,
            rgba(0, 195, 255, 0.12) 1px,
            transparent 1px);

    background-size: 45px 45px;
    pointer-events: none;
    z-index: -1;
}

/* NEON GLOW ANIMATION */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle,
            transparent 30%,
            rgba(0, 0, 0, 0.5) 100%);

    animation: neonPulse 4s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: -1;
}

@keyframes neonPulse {
    from {
        opacity: 0.4;
    }

    to {
        opacity: 1;
    }
}

/* GLOWING HEADINGS */
h1,
h2 {
    color: #ffffff;
    text-shadow:
        0 0 5px #00cfff,
        0 0 15px #008cff,
        0 0 30px #0055ff;
}

/* NEON BUTTONS */
button {
    background: transparent;
    color: #00cfff;
    border: 2px solid #00cfff;
    padding: 12px 24px;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 0 12px #008cff;
    transition: 0.3s ease;
}

button:hover {
    background: #00cfff;
    color: #020617;
    box-shadow:
        0 0 20px #00cfff,
        0 0 40px #008cff;
}



/* Center the Contact Section */
#contact {
  width: 100%;
  padding: 50px 20px;
  box-sizing: border-box;
  text-align: center;
  color: white;
}

/* Center the Contact Heading */
#contact h2 {
  text-align: center;
  color: #00e5ff;
  margin-bottom: 15px;
}

/* Center the Contact Form Box */
.contact-box {
  width: 100%;
  max-width: 600px;
  margin: 30px auto;
  padding: 30px;
  box-sizing: border-box;
  background: #0a192f;
  border: 1px solid #00e5ff;
  border-radius: 15px;
  box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
}

/* Align Form Fields */
.contact-box form {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.contact-box input,
.contact-box textarea {
  width: 100%;
  padding: 14px;
  box-sizing: border-box;
  background: #050816;
  color: white;
  border: 1px solid #164e63;
  border-radius: 8px;
  font: inherit;
}

/* Center the Send Button */
.contact-box button {
  width: 100%;
  padding: 14px;
  background: #00e5ff;
  color: #050816;
  font-weight: bold;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}




    </style>
</head>
<body>
        <!-- Header / Navigation -->
    <div class="container">
      <header class="d-flex justify-content-center py-3">
        <ul class="nav nav-pills">
          <li class="nav-item">
            <a href="index.html" class="nav-link " aria-current="page">Home</a>
          </li>
          <li class="nav-item">
            <a href="projects.html" class="nav-link">Projects</a>
          </li>
          <li class="nav-item">
            <a href="about.html" class="nav-link">About</a>
          </li>
          <li class="nav-item">
            <a href="contact.html" class="nav-link active">Contact</a>
          </li>
        </ul>
      </header>

    </div>

        <!-- Contact Me -->
    <section id="contact" class="container py-5">
      <h2 class="text-center">Contact Me</h2>
      <p class="text-center">
        Have a project idea? Let's build something amazing!
      </p>
      <div class="contact-box">
        <form action="https://formsubmit.co/leoenoch49@gmail.com" method="POST">
          <input type="text" name="name" placeholder="Your Name" required />

          <input type="email" name="email" placeholder="Your Email" required />

          <textarea
            name="message"
            placeholder="Your Message"
            rows="5"
            required
          ></textarea>

          <input
            type="hidden"
            name="_subject"
            value="New Message from Leo's Portfolio"
          />

          <button type="submit">Send Message 🚀</button>
        </form>
      </div>
    </section>


    <footer class="py-3 my-4">
      <ul class="nav justify-content-center border-bottom pb-3 mb-3">
        <li class="nav-item">
          <a href="index.html" class="nav-link px-2 fg-2">Home</a>
        </li>
        <li class="nav-item">
          <a href="projects.html" class="nav-link px-2 fg-2">Projects</a>
        </li>
        <li class="nav-item">
          <a href="contact.html" class="nav-link px-2 fg-2">Contact</a>
        </li>
        <li class="nav-item">
          <a href="about.html" class="nav-link px-2 fg-2">About</a>
        </li>
      </ul>
      <p class="text-center fg-2">© 2026 </p>
    </footer>

          <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
</body>
</html>
